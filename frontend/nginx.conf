server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The SPA and the API share an origin in production, which takes CORS out of
    # the picture and spares every request a preflight.
    location /api/ {
        include /etc/nginx/conf.d/security-headers.conf;

        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://api:8080/health;
        access_log off;
    }

    # nginx's mime.types has no entry for .webmanifest, so without this it goes out
    # as application/octet-stream and Chrome ignores the manifest. default_type only
    # fills the gap, rather than replacing the inherited type map the way a `types`
    # block here would.
    location = /manifest.webmanifest {
        include /etc/nginx/conf.d/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Icons have stable names, so they cannot be cache-busted by a rebuild the way
    # hashed assets can. A week is long enough to be worth having and short enough
    # that changing the mark actually reaches people.
    location ~ ^/(favicon\.(ico|svg)|apple-touch-icon\.png|icon-\d+\.png)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Asset filenames carry a content hash, so they can be cached forever.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routing: an unknown path is a route, not a 404. index.html is
    # never cached, or a deploy would never reach an open tab.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
