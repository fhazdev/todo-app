# Security headers, in their own file because nginx's add_header does not merge:
# a single add_header inside a location discards every one inherited from the
# server block. Any location that sets a header of its own has to include this
# again, which is why it lives here rather than being written out once.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

# The app is self-contained apart from Google fonts and Google sign-in. connect-src
# stays 'self' because nginx proxies /api on this same origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
